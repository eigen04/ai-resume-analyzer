spring.application.name=ai-resume-analyzer

# =====================================================================
# Database (override via env vars in prod)
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/resume_analyzer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =====================================================================
# File Upload
# =====================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================================
# Spring AI — Groq Cloud (Open-Source Models via OpenAI API format)
# =====================================================================
spring.ai.openai.api-key=${GROQ_API_KEY:dummy_key}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-70b-versatile
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.enabled=false

# =====================================================================
# Spring AI — Ollama (Embeddings only)
# =====================================================================
spring.ai.ollama.chat.enabled=false
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# =====================================================================
# Spring AI — pgvector
# =====================================================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

# =====================================================================
# RAG Configuration (tunable without code changes)
# =====================================================================
rag.topK=5
rag.similarityThreshold=0.60
rag.chunkSize=500
rag.chunkOverlap=50

# =====================================================================
# Actuator
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=AI Resume Analyzer
info.app.version=1.0.0

# =====================================================================
# Spring Cloud Function (disable scan to prevent context load issues)
# =====================================================================
spring.cloud.function.scan.enabled=false

# =====================================================================
# Server
# =====================================================================
server.port=${SERVER_PORT:8080}

# =====================================================================
# Redis (for caching & rate limiting)
# =====================================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# =====================================================================
# Security & JWT Configuration
# =====================================================================
jwt.secret=${JWT_SECRET:dGhpc2lzYWRlZmF1bHRzZWNyZXRrZXlmb3Jsb2NhbGRldm9ubHkxMjM0NTY3OA==}
jwt.expiration=86400000

# Rate limits (requests per minute)
rate.limit.uploads=5
rate.limit.queries=10
rate.limit.anonymous=20